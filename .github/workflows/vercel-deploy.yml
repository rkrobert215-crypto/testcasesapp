name: Deploy Vercel

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Vercel environment to deploy
        required: true
        default: production
        type: choice
        options:
          - production
          - preview

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Validate Vercel deployment secrets
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=()
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "::error title=Missing Vercel deployment secrets::Add these GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel environment
        run: npx vercel@latest pull --yes --environment=${{ inputs.environment }} --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build preview
        if: ${{ inputs.environment != 'production' }}
        run: npx vercel@latest build --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build production
        if: ${{ inputs.environment == 'production' }}
        run: npx vercel@latest build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy preview
        if: ${{ inputs.environment != 'production' }}
        run: npx vercel@latest deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy production
        if: ${{ inputs.environment == 'production' }}
        run: npx vercel@latest deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
